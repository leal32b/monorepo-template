name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Lint, types and boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint:ci
      - run: pnpm typecheck
      - run: pnpm lint:deps
      - run: pnpm lint:fsd
      - name: Dead files, exports and dependencies (knip)
        run: pnpm knip

  test:
    name: Tests with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Includes the api-db project: PGlite runs in-process, no Postgres service needed.
      - run: pnpm test:coverage

  e2e:
    name: Browser journeys and accessibility (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @repo/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system dependencies
        if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium
      - name: Install the system dependencies of Chromium
        if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm --filter @repo/e2e exec playwright install-deps chromium
      # Builds the web app and starts PGlite and the API itself (ADR 0045): no service, no secret.
      - run: pnpm test:e2e
      - name: Upload the report and the traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 14

  build:
    name: Build web and API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @repo/web build
      - name: Bundle the web Worker (not deployed)
        run: pnpm --filter @repo/web exec wrangler deploy --dry-run
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the API image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
