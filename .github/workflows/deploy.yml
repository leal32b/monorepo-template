name: Deploy

# Production deploy after CI passes on main (ADR 0014). Re-run it by hand to redeploy main, or run it
# by hand on any branch with `staging` to deploy the optional staging environment (ADR 0078).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy. Production takes main only; staging takes any branch.
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

# The GitHub environment deployed: production unless a manual run chose staging (ADR 0078).
env:
  DEPLOY_ENV: ${{ inputs.environment || 'production' }}

# One deploy at a time per environment; a newer one waits instead of cancelling one in progress.
concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  image:
    name: Publish the API image
    # Only a green CI run of a push to main in this repository, or a manual run on main: never a
    # pull request, a fork or another branch. Staging, by hand only, takes any branch of this repository.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      # Production deploys only what CI passed on main; staging holds a branch to the same rule.
      - name: Check that CI passed on this commit
        if: inputs.environment == 'staging'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$SHA" --status success \
            --limit 1 --json databaseId --jq length)
          if [ "$passed" != 1 ]; then
            echo "::error::No green CI run for $SHA: push the branch, open its pull request, and wait for CI."
            exit 1
          fi
      - name: Name the image
        id: ref
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # GHCR names must be lowercase.
          repository="${GITHUB_REPOSITORY,,}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repository}-api:$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.sha }}
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.ref.outputs.image }}
          # Logged on every line and answered by /api/health (ADR 0046).
          build-args: RELEASE=${{ steps.ref.outputs.sha }}
          # Links the package to this repository on GHCR.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api:
    name: Deploy the API to Render
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ vars.API_ORIGIN }}/api/health
    env:
      RENDER_API: https://api.render.com/v1/services/${{ vars.RENDER_SERVICE_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Check the configuration
        env:
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_API_URL: ${{ vars.ASAAS_API_URL }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          # Names only: a secret's value is never printed.
          missing=''
          for name in RENDER_SERVICE_ID API_ORIGIN WEB_ORIGIN PROXY_SECRET BETTER_AUTH_SECRET RESEND_API_KEY EMAIL_FROM \
            ASAAS_API_KEY ASAAS_API_URL ASAAS_WEBHOOK_TOKEN \
            STORAGE_ENDPOINT STORAGE_BUCKET STORAGE_ACCESS_KEY_ID STORAGE_SECRET_ACCESS_KEY; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          # Google sign-in is optional, but needs both (ADR 0020).
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -z "$GOOGLE_CLIENT_SECRET" ]; then missing="$missing GOOGLE_CLIENT_SECRET"; fi
          if [ -z "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then missing="$missing GOOGLE_CLIENT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Set these in the $DEPLOY_ENV environment:$missing"
            echo "::error::First deploy: create the Render service from $IMAGE, then re-run the failed jobs."
            exit 1
          fi
          # Origins as the API and the Worker read them (ADR 0019): https and a host, nothing after it. The
          # file store's endpoint too: the bucket is a variable of its own (ADR 0076).
          wrong=''
          for name in API_ORIGIN WEB_ORIGIN STORAGE_ENDPOINT; do
            [[ "$(printenv "$name")" =~ ^https://[^/?#[:space:]]+$ ]] || wrong="$wrong $name"
          done
          if [ -n "$wrong" ]; then
            echo "::error::Set these as https://host, with no path and no trailing slash:$wrong"
            exit 1
          fi
          # Billing is real behind https (ADR 0064): a key works only on its environment's URL.
          case "$ASAAS_API_URL" in
            https://api-sandbox.asaas.com/v3) prefix='$aact_hmlg_' ;;
            https://api.asaas.com/v3) prefix='$aact_prod_' ;;
            *) echo "::error::Set ASAAS_API_URL to https://api.asaas.com/v3, or the sandbox's https://api-sandbox.asaas.com/v3"; exit 1 ;;
          esac
          if [[ "$ASAAS_API_KEY" != "$prefix"* ]]; then
            echo "::error::ASAAS_API_KEY is not a key of the environment of ASAAS_API_URL (it must start with $prefix)"
            exit 1
          fi
          # Staging never charges anyone (ADR 0078).
          if [ "$DEPLOY_ENV" = staging ] && [ "$prefix" != '$aact_hmlg_' ]; then
            echo "::error::Staging bills on the Asaas sandbox: set ASAAS_API_URL to https://api-sandbox.asaas.com/v3"
            exit 1
          fi
      - name: Replace the service variables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_API_URL: ${{ vars.ASAAS_API_URL }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
          STORAGE_REGION: ${{ vars.STORAGE_REGION }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
        run: |
          # PUT replaces the whole set: GitHub is the only source of the service variables. The body is
          # built first, so a jq error stops the step before Render is called.
          body=$(jq -n '[
            {key: "DATABASE_URL", value: env.DATABASE_URL},
            {key: "WEB_ORIGIN", value: env.WEB_ORIGIN},
            {key: "CORS_ORIGINS", value: env.CORS_ORIGINS},
            {key: "PROXY_SECRET", value: env.PROXY_SECRET},
            {key: "BETTER_AUTH_SECRET", value: env.BETTER_AUTH_SECRET},
            {key: "RESEND_API_KEY", value: env.RESEND_API_KEY},
            {key: "EMAIL_FROM", value: env.EMAIL_FROM},
            {key: "ASAAS_API_KEY", value: env.ASAAS_API_KEY},
            {key: "ASAAS_API_URL", value: env.ASAAS_API_URL},
            {key: "ASAAS_WEBHOOK_TOKEN", value: env.ASAAS_WEBHOOK_TOKEN},
            {key: "STORAGE_ENDPOINT", value: env.STORAGE_ENDPOINT},
            {key: "STORAGE_BUCKET", value: env.STORAGE_BUCKET},
            {key: "STORAGE_ACCESS_KEY_ID", value: env.STORAGE_ACCESS_KEY_ID},
            {key: "STORAGE_SECRET_ACCESS_KEY", value: env.STORAGE_SECRET_ACCESS_KEY},
            {key: "LOG_LEVEL", value: "info"}
          ] + if env.GOOGLE_CLIENT_ID == "" then [] else [
            {key: "GOOGLE_CLIENT_ID", value: env.GOOGLE_CLIENT_ID},
            {key: "GOOGLE_CLIENT_SECRET", value: env.GOOGLE_CLIENT_SECRET}
          ] end + if env.STORAGE_REGION == "" then [] else [
            {key: "STORAGE_REGION", value: env.STORAGE_REGION}
          ] end')
          printf '%s' "$body" | curl --fail-with-body --silent --show-error -X PUT "$RENDER_API/env-vars" \
            -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' \
            --data @- > /dev/null
      - name: Deploy the image and wait until it is live
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          deploy=$(jq -n '{imageUrl: env.IMAGE}' | curl --fail-with-body --silent --show-error \
            -X POST "$RENDER_API/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' \
            --data @- | jq -r .id)
          echo "Render deploy $deploy of $IMAGE"
          for _ in $(seq 60); do
            status=$(curl --fail-with-body --silent --show-error "$RENDER_API/deploys/$deploy" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r .status)
            echo "status: $status"
            case "$status" in
              live) exit 0 ;;
              *_failed | canceled | deactivated) exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::The deploy was not live after 10 minutes."
          exit 1
      - name: Smoke test /api/health and the Worker check
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          SHA: ${{ needs.image.outputs.sha }}
        run: |
          # Retries cover Neon waking from suspension.
          health=$(curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
            "$API_ORIGIN/api/health")
          echo "$health"
          # The new image answers, not the one it replaced (ADR 0046).
          jq -e --arg sha "$SHA" '.release == $sha' <<< "$health" > /dev/null \
            || { echo "::error::/api/health answers another release than $SHA"; exit 1; }
          # Any other path answers only through the web Worker (ADR 0022).
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$API_ORIGIN/api/smoke-test")
          [ "$status" = 403 ] || { echo "::error::a direct call to the API answered $status, not 403"; exit 1; }

  web:
    name: Deploy the web to Cloudflare
    needs: [image, api]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.image.outputs.sha }}
          persist-credentials: false
      - name: Check the configuration
        env:
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
        run: |
          if [ -z "$PROXY_SECRET" ]; then
            echo "::error::Set the PROXY_SECRET secret in the $DEPLOY_ENV environment (ADR 0022)."
            exit 1
          fi
          # The CSP names the file store, so the page may show logos and send uploads (ADR 0076).
          if [ -z "$STORAGE_ENDPOINT" ]; then
            echo "::error::Set the STORAGE_ENDPOINT variable in the $DEPLOY_ENV environment (ADR 0076)."
            exit 1
          fi
      - uses: ./.github/actions/setup
      # No VITE_API_BASE_URL: the web calls /api on its own origin and the Worker proxies it (ADR 0019).
      # VITE_RELEASE is the commit, so a browser error report names the build that threw (ADR 0072).
      # STORAGE_ORIGIN puts the file store in the CSP of _headers (ADR 0076).
      - name: Build the web
        run: pnpm --filter @repo/web build
        env:
          VITE_RELEASE: ${{ needs.image.outputs.sha }}
          STORAGE_ORIGIN: ${{ vars.STORAGE_ENDPOINT }}
      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          # Staging is the Worker `<name>-staging` of wrangler.jsonc; production, the top-level one.
          environment: ${{ inputs.environment == 'staging' && 'staging' || '' }}
          command: deploy
          vars: API_ORIGIN
          secrets: PROXY_SECRET
      - name: Smoke test the page, its headers and the Worker
        env:
          WEB_URL: ${{ steps.deploy.outputs.deployment-url }}
          STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --dump-header headers.txt --output index.html "$WEB_URL/"
          # The headers come from apps/web/public/_headers: a deploy that drops them fails here.
          grep -qi '^x-content-type-options: nosniff' headers.txt || { echo "::error::/ lacks X-Content-Type-Options"; exit 1; }
          grep -qi "^content-security-policy: default-src 'none'" headers.txt || { echo "::error::/ lacks the CSP"; exit 1; }
          # The CSP lets the page show logos from the file store and send uploads to it (ADR 0076).
          grep -qiF "img-src 'self' data: $STORAGE_ENDPOINT;" headers.txt && grep -qiF "connect-src 'self' $STORAGE_ENDPOINT;" headers.txt \
            || { echo "::error::the CSP does not name the file store $STORAGE_ENDPOINT"; exit 1; }
          grep -qi '^strict-transport-security: max-age=' headers.txt || { echo "::error::/ lacks HSTS"; exit 1; }
          grep -qi '^permissions-policy: .*camera=()' headers.txt || { echo "::error::/ lacks the Permissions-Policy"; exit 1; }
          grep -qi '^cross-origin-opener-policy: same-origin' headers.txt || { echo "::error::/ lacks COOP"; exit 1; }
          asset=$(grep -o '/assets/[^"]*\.js' index.html | head -1)
          curl --fail --silent --show-error --head "$WEB_URL$asset" | grep -qi '^cache-control:.*immutable' \
            || { echo "::error::$asset is not cached as immutable"; exit 1; }
          # The Worker: a client-side route gets the page and its headers, a missing asset a 404.
          curl --fail --silent --show-error --dump-header route.txt --output /dev/null \
            -H 'Sec-Fetch-Mode: navigate' "$WEB_URL/smoke-test/client-route"
          grep -qi '^content-security-policy:' route.txt || { echo "::error::a client-side route lacks the CSP"; exit 1; }
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$WEB_URL/assets/smoke-test-missing.js")
          [ "$status" = 404 ] || { echo "::error::a missing asset answered $status, not 404"; exit 1; }
          # And /api/* reaches the API through the Worker. Retries cover Neon waking up.
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "$WEB_URL/api/health"
          # The API accepts the Worker's secret: an unknown path is a 404, not the 403 of a direct call.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$WEB_URL/api/smoke-test")
          [ "$status" = 404 ] || { echo "::error::/api through the Worker answered $status, not 404"; exit 1; }
          # Better Auth answers through the Worker, and the session guard refuses a visitor.
          curl --fail-with-body --silent --show-error "$WEB_URL/api/auth/ok"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$WEB_URL/api/me")
          [ "$status" = 401 ] || { echo "::error::/api/me without a session answered $status, not 401"; exit 1; }
