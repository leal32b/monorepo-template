<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrada no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: auto; position: relative;">
  <dc-import name="Entry" start-screen="{{startScreen}}" outcome="{{outcome}}" server="{{server}}" theme="{{theme}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"outcome":{"editor":"enum","options":["success","error","unconfirmed","rateLimited","network"],"default":"success","section":"Estado"},"server":{"editor":"enum","options":["ok","degraded","down"],"default":"ok","section":"Estado"},"startScreen":{"editor":"enum","options":["signIn","signUp","checkEmail","twoFactor","forgot","reset","resetExpired","resetDone"],"default":"signIn","section":"Estado"},"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Estado"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      outcome: this.props.outcome ?? 'success',
      server: this.props.server ?? 'ok',
      startScreen: this.props.startScreen ?? 'signIn',
      theme: this.props.theme ?? 'light'
    };
  }
}
</script>
</body>
</html>
