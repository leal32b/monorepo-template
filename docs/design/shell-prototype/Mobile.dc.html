<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>App no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative;">
  <dc-import name="Main" start-screen="{{startScreen}}" theme="{{theme}}" server="{{server}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Estado"},"server":{"editor":"enum","options":["ok","degraded","down"],"default":"ok","section":"Estado"},"startScreen":{"editor":"enum","options":["home","projects","security","profile","preferences","org","members"],"default":"security","section":"Estado"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      server: this.props.server ?? 'ok',
      startScreen: this.props.startScreen ?? 'security'
    };
  }
}
</script>
</body>
</html>
