pre-commit:
  commands:
    biome:
      priority: 1
      glob: "*.{js,mjs,cjs,ts,jsx,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files} && git update-index --again
    # Runs after Biome (it may rewrite files); only the tests that import a staged file.
    test:
      priority: 2
      glob: "*.{js,mjs,cjs,ts,jsx,tsx}"
      run: pnpm exec vitest related --run --passWithNoTests {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    verify:
      run: pnpm typecheck && pnpm test