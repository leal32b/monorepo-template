packages:
  - apps/*
  - packages/*

allowBuilds:
  '@swc/core': false
  esbuild: true
  lefthook: true
  workerd: false

catalogMode: strict
catalogPrune: true

# Refuse dependencies whose `engines` exclude the current Node version.
engineStrict: true

# One version per dependency for the whole workspace: package.json files say `catalog:`.
catalog:
  '@axe-core/playwright': ^4.14.0
  '@biomejs/biome': ^2.6.2
  '@commitlint/cli': ^21.2.4
  '@commitlint/config-conventional': ^21.2.4
  '@electric-sql/pglite': ^0.5.11
  '@electric-sql/pglite-socket': ^0.2.14
  '@feature-sliced/steiger-plugin': ^0.8.1
  '@kobalte/core': ^0.13.14
  '@phosphor-icons/core': ^2.1.1
  '@playwright/test': ^1.65.0
  '@solid-primitives/i18n': ^2.2.1
  '@solidjs/router': ^1.0.0
  '@solidjs/testing-library': ^0.8.10
  '@swc/core': ^1.16.20
  '@testing-library/jest-dom': ^7.0.1
  '@types/node': ^26.6.5
  '@types/pg': ^8.23.1
  '@unocss/core': ^66.12.0
  '@unocss/preset-wind4': ^66.12.0
  '@vitest/coverage-v8': ^5.0.5
  better-auth: ^1.7.14
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  dependency-cruiser: ^18.7.0
  esbuild: ^0.28.2
  happy-dom: ^21.0.4
  knip: ^6.44.2
  kysely: ^0.29.7
  lean-qr: ^2.7.4
  lefthook: ^2.2.2
  pg: ^8.23.1
  pino: ^10.4.0
  pino-pretty: ^13.2.0
  solid-js: ^1.9.17
  steiger: ^0.8.1
  tsx: ^4.23.15
  typescript: ^7.0.2
  unocss: ^66.12.0
  vite: ^8.3.5
  vite-plugin-solid: ^2.11.14
  vitest: ^5.0.5
  wrangler: ^4.153.0
  zod: ^4.6.7
minimumReleaseAgeExclude:
  - knip@6.44.2
